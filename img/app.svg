<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill-rule="evenodd">
  <!-- Owl eye / Athena symbol: outer ring with pupil -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="16" cy="16" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="16" cy="16" r="2.5" fill="currentColor"/>
  <!-- small tick marks at cardinal points -->
  <line x1="16" y1="2"  x2="16" y2="5"  stroke="currentColor" stroke-width="1.5"/>
  <line x1="16" y1="27" x2="16" y2="30" stroke="currentColor" stroke-width="1.5"/>
  <line x1="2"  y1="16" x2="5"  y2="16" stroke="currentColor" stroke-width="1.5"/>
  <line x1="27" y1="16" x2="30" y2="16" stroke="currentColor" stroke-width="1.5"/>
</svg>
